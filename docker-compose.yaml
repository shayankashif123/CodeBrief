services:
  # ─── NestJS Backend ───────────────────────────────────────────
  nestjs:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: codebrief_nestjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Backend URL (for GitHub OAuth callback construction)
      BACKEND_URL: ${BACKEND_URL}
      NODE_ENV: development
      PORT: 3000

      # PostgreSQL
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      # MongoDB
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # FastAPI internal URL
      FASTAPI_URL: http://fastapi:8000

      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: 30d

      # GitHub App
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

      # Frontend URL (for OAuth redirect)
      FRONTEND_URL: ${FRONTEND_URL}

    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codebrief_network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev   # ← Overrides Dockerfile CMD, no dist/ needed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s          # ← Increased for nest start --watch boot time

  # ─── FastAPI AI Service ───────────────────────────────────────
  fastapi:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: codebrief_fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: development

      # Qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: codebase_chunks
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      # MongoDB (for review + doc storage)
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MONGODB_DB_NAME: ${MONGO_DB}

      # Google AI
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      EMBEDDING_MODEL: models/text-embedding-004
      GEMINI_MODEL: gemini-2.0-flash

      # Internal auth (NestJS calls FastAPI with this header)
      INTERNAL_SECRET: ${INTERNAL_SECRET}

    depends_on:
      qdrant:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - codebrief_network
    volumes:
      - ./ai-service:/app
      - /tmp/codebrief-repos:/tmp/repos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: codebrief_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - codebrief_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: codebrief_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - codebrief_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: codebrief_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - codebrief_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── Qdrant Vector Database ───────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: codebrief_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - codebrief_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

# ─── Networks ─────────────────────────────────────────────────
networks:
  codebrief_network:
    driver: bridge
    name: codebrief_network

# ─── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    name: codebrief_postgres_data
  mongo_data:
    name: codebrief_mongo_data
  redis_data:
    name: codebrief_redis_data
  qdrant_data:
    name: codebrief_qdrant_data
